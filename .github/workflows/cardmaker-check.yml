name: Check Card Maker

on:
  push:
    paths:
      - "CardMaker.html"
      - "assets/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/**"
      - ".github/workflows/cardmaker-check.yml"
  pull_request:
    paths:
      - "CardMaker.html"
      - "assets/**"
      - "schemas/**"
      - "fixtures/**"
      - "tests/**"
      - ".github/workflows/cardmaker-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/cardml-validator.test.mjs
