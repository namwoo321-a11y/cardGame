name: Auto Merge BuffCS

on:
  push:
    branches:
      - main
    paths:
      - 'Buffs/**/*.cs'
      - 'merge_buffs.py'
      - '.github/workflows/merge-buffs.yml'

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python script to merge
        run: python merge_buffs.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add BuffCS.cs
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generated BuffCS.cs"
          git push
