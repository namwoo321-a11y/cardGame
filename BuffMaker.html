<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Buff Code Maker (Advanced)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .code-panel::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans text-sm md:text-base relative">

    <!-- 상단 헤더 -->
    <header class="bg-blue-800 text-white p-3 shadow-md flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-2">
            <i data-lucide="swords" class="w-5 h-5 md:w-6 md:h-6"></i>
            <h1 class="text-lg md:text-xl font-bold tracking-wide">Buff Code Maker</h1>
        </div>
        <div class="flex gap-2">
            <!-- 모바일 전용 코드 보기 토글 -->
            <button onclick="toggleMobileCode()" class="md:hidden flex items-center gap-1 bg-slate-700 text-white px-2 py-1.5 rounded text-xs font-bold shadow">
                <i data-lucide="code-2" class="w-4 h-4"></i> 코드 확인
            </button>

            <button onclick="copyAndOpenGitHub()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1.5 md:px-3 md:py-1.5 rounded text-xs md:text-sm font-bold transition shadow">
                <i data-lucide="github" class="w-4 h-4"></i> <span class="hidden md:inline">코드 복사 및 GitHub 덮어씌우기</span><span class="md:hidden">GitHub 적용</span>
            </button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden relative">
        
        <!-- 좌측 패널: 버프 리스트 -->
        <div class="w-24 md:w-64 bg-slate-200 border-r border-slate-300 flex flex-col shrink-0 z-10">
            <div class="p-2 md:p-3 bg-slate-300 font-bold text-slate-700 flex justify-between items-center text-xs md:text-sm">
                <span class="hidden md:inline">버프 목록</span>
                <span class="md:hidden">목록</span>
                <button onclick="addNewBuff()" class="bg-blue-600 text-white p-1 rounded hover:bg-blue-500 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="buff-list" class="flex flex-col overflow-y-auto p-2 gap-2 flex-1">
                <!-- JS 렌더링 -->
            </div>
        </div>

        <!-- 중앙 패널: 단일 버프 편집기 -->
        <div id="editor-panel" class="flex-1 h-full overflow-y-auto p-3 md:p-6 space-y-4 md:space-y-6 pb-20">
            
            <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base md:text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="info" class="w-4 h-4 text-blue-600"></i> 메타 데이터
                    </h2>
                    <button onclick="deleteCurrentBuff()" class="text-xs text-red-500 hover:text-red-700 flex items-center gap-1 font-bold">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 이 버프 삭제
                    </button>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Class Name (영문)</label>
                        <input type="text" id="inp-className" data-bind="className" placeholder="예: Prote_A" class="w-full border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">BnameKR (인게임 명칭)</label>
                        <input type="text" id="inp-bNameKR" data-bind="bNameKR" placeholder="예: 자세 - 공세" class="w-full border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">BuffType</label>
                        <select id="inp-buffType" data-bind="buffType" class="w-full border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Good">Good (긍정)</option>
                            <option value="Bad">Bad (부정)</option>
                            <option value="Power">Power (지속)</option>
                            <option value="Resource">Resource (자원)</option>
                            <option value="Important">Important (주요)</option>
                        </select>
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ActivatedTurn (지속 턴)</label>
                        <input type="number" id="inp-activatedTurn" data-bind="activatedTurn" placeholder="0이면 사용안함" class="w-full border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="col-span-2 md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Description (설명 툴팁)</label>
                        <textarea id="inp-description" data-bind="description" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-xs md:text-sm" rows="2" placeholder="예: 힘 +{stack}\n턴 종료시 제거"></textarea>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-base md:text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> 발동 로직 설정 (Gain / Consume 등 지원)
                </h2>
                <div id="event-list-container" class="space-y-2 pb-10">
                    <!-- JS 렌더링 -->
                </div>
            </section>
        </div>

        <!-- 우측 패널: 모바일에서는 display:none(숨김) 기반으로 작동. 토글시 전체화면으로 등장 -->
        <div id="code-viewer-panel" class="hidden md:flex flex-col absolute inset-0 z-30 md:static md:w-[400px] lg:w-[500px] bg-slate-900 border-l border-slate-700 shrink-0 h-full">
            <div class="flex justify-between items-center bg-slate-800 px-3 py-2 shrink-0 border-b border-slate-700">
                <div class="flex gap-2">
                    <button onclick="setViewMode('single')" id="btn-view-single" class="text-xs px-2 py-1 rounded bg-slate-600 text-white font-bold">현재 버프</button>
                    <button onclick="setViewMode('full')" id="btn-view-full" class="text-xs px-2 py-1 rounded bg-transparent text-slate-400 hover:text-white">전체(BuffEx)</button>
                </div>
                <!-- 모바일 전용 닫기 버튼 -->
                <button onclick="toggleMobileCode()" class="md:hidden text-slate-300 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-3 overflow-y-auto flex-1 code-panel relative">
                <pre><code id="preview-code" class="text-emerald-400 font-mono text-[11px] md:text-[13px] leading-relaxed break-all whitespace-pre-wrap"></code></pre>
            </div>
        </div>
    </main>

    <script>
        // --- 1. 상수 및 데이터 구조 ---
        const EVENT_DEF = [
            { id: 'OnActivate', name: 'OnActivate()', desc: '최초 부여 시' },
            { id: 'OnUpdate', name: 'OnUpdate(int val)', desc: '스택 갱신 시' },
            { id: 'OnDeactivate', name: 'OnDeactivate()', desc: '완전히 제거될 때' },
            { id: 'OnTurnStart', name: 'OnTurnStart()', desc: '턴 시작 시' },
            { id: 'OnTurnEnd', name: 'OnTurnEnd()', desc: '턴 종료 시' },
            { id: 'BeforeDamaged', name: 'BeforeDamaged(DamContext DC)', desc: '피격 전 (피해량 조작)' },
            { id: 'AfterDamaged', name: 'AfterDamaged(DamContext DC)', desc: '피격 후' },
            { id: 'BeforeAttack', name: 'BeforeAttack(DamContext DC)', desc: '공격 전 (조건 검사, 자원 소모)' },
            { id: 'AfterAttack', name: 'AfterAttack(DamContext DC)', desc: '공격 후' }
        ];

        const EVENT_SIGNATURES = {
            OnActivate: "public override void OnActivate()\n    {",
            OnDeactivate: "public override void OnDeactivate()\n    {",
            OnUpdate: "public override void OnUpdate(int val)\n    {",
            OnTurnStart: "public override void OnTurnStart()\n    {",
            OnTurnEnd: "public override void OnTurnEnd()\n    {",
            BeforeDamaged: "public override DamContext BeforeDamaged(DamContext DC)\n    {",
            AfterDamaged: "public override void AfterDamaged(DamContext DC)\n    {",
            BeforeAttack: "public override DamContext BeforeAttack(DamContext DC)\n    {",
            AfterAttack: "public override void AfterAttack(DamContext DC)\n    {"
        };

        const RETURN_STATEMENTS = {
            BeforeDamaged: "        return DC;\n",
            BeforeAttack: "        return DC;\n"
        };

        let buffCollection = [];
        let currentIndex = 0;
        let viewMode = 'single';

        // --- 2. 초기화 ---
        function initApp() {
            const saved = localStorage.getItem('buffMakerData_v2');
            if (saved) {
                try { buffCollection = JSON.parse(saved); } catch (e) { buffCollection = []; }
            }

            if (buffCollection.length === 0) {
                buffCollection.push(createEmptyBuff("NewBuff", "새 버프"));
            }

            currentIndex = 0;
            renderAll();
        }

        function saveData() {
            localStorage.setItem('buffMakerData_v2', JSON.stringify(buffCollection));
        }

        function createEmptyBuff(cName, kName) {
            let b = {
                id: Date.now() + Math.floor(Math.random() * 1000),
                className: cName,
                bNameKR: kName,
                description: "",
                buffType: "Good",
                activatedTurn: 0,
                events: {}
            };
            EVENT_DEF.forEach(ev => b.events[ev.id] = { active: false, actions: [] });
            return b;
        }

        // --- 3. UI 렌더링 ---
        function renderAll() {
            renderBuffList();
            renderEditor();
            renderCode();
            lucide.createIcons();
        }

        function renderBuffList() {
            const listEl = document.getElementById('buff-list');
            let html = '';
            buffCollection.forEach((buff, idx) => {
                const isSelected = idx === currentIndex;
                html += `
                    <div class="flex flex-col p-2 rounded cursor-pointer transition ${isSelected ? 'bg-blue-100 border-blue-400 border shadow-sm' : 'bg-white border-slate-200 border hover:bg-slate-50'}" onclick="selectBuff(${idx})">
                        <div class="font-bold text-slate-800 text-xs truncate w-full">${buff.className}</div>
                        <div class="text-[10px] text-slate-500 truncate w-full">${buff.bNameKR || '이름 없음'}</div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function renderEditor() {
            if (buffCollection.length === 0) return;
            const buff = buffCollection[currentIndex];
            
            document.getElementById('inp-className').value = buff.className || "";
            document.getElementById('inp-bNameKR').value = buff.bNameKR || "";
            document.getElementById('inp-buffType').value = buff.buffType || "Good";
            document.getElementById('inp-activatedTurn').value = buff.activatedTurn || 0;
            document.getElementById('inp-description').value = buff.description || "";

            let html = '';
            EVENT_DEF.forEach(ev => {
                const evData = buff.events[ev.id];
                const isActive = evData.active;
                
                html += `
                <div class="bg-white rounded-lg shadow-sm border transition-all duration-200 ${isActive ? 'border-blue-500 ring-1 ring-blue-500' : 'border-slate-200'}">
                    <div class="flex items-center justify-between p-2.5 cursor-pointer hover:bg-slate-50 rounded-lg" onclick="toggleEvent('${ev.id}')">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" ${isActive ? 'checked' : ''} onclick="event.stopPropagation(); toggleEvent('${ev.id}')" class="w-4 h-4 text-blue-600 rounded">
                            <span class="font-bold font-mono text-slate-800 text-xs md:text-sm">${ev.name}</span>
                        </div>
                        <span class="text-[10px] text-slate-400 hidden md:block">${ev.desc}</span>
                    </div>
                `;

                if (isActive) {
                    html += `<div class="p-2 md:p-4 pt-0 border-t border-slate-100 bg-slate-50/50 rounded-b-lg">`;
                    html += `<div class="space-y-1.5 mt-2">`;
                    evData.actions.forEach((act, idx) => {
                        html += renderAction(ev.id, idx, act);
                    });
                    html += `</div>`;
                    
                    html += `
                        <div class="mt-3 flex flex-wrap gap-1.5">
                            <button onclick="addAction('${ev.id}', 'StatChange')" class="bg-teal-50 border border-teal-200 text-teal-800 px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">스탯 증감 (Gain/Consume)</button>
                            <button onclick="addAction('${ev.id}', 'AddBuff')" class="bg-blue-50 border border-blue-200 text-blue-800 px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">버프 부여</button>
                            <button onclick="addAction('${ev.id}', 'IfCondition')" class="bg-amber-50 border border-amber-200 text-amber-800 px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">조건문 (If)</button>
                            <button onclick="addAction('${ev.id}', 'EndIf')" class="bg-amber-50 border border-amber-200 text-amber-800 px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">조건 닫기 (})</button>
                            <button onclick="addAction('${ev.id}', 'RemoveThis')" class="bg-red-50 border border-red-200 text-red-800 px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">자신 제거</button>
                            <button onclick="addAction('${ev.id}', 'Custom')" class="bg-slate-800 text-white px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">C# 커스텀</button>
                    `;
                    if(ev.id === 'BeforeAttack' || ev.id === 'BeforeDamaged') html += `<button onclick="addAction('${ev.id}', 'DCModify')" class="bg-purple-50 border border-purple-200 text-purple-800 px-2 py-1 text-[10px] md:text-xs rounded shadow-sm">DC 수정</button>`;
                    
                    html += `</div></div>`;
                }
                html += `</div>`;
            });

            document.getElementById('event-list-container').innerHTML = html;
        }

        function renderAction(eventId, idx, act) {
            let inner = '';
            const targets = ['owner', 'caster', 'DC.Target', 'DC.Attacker'].map(t => `<option ${act.target===t?'selected':''}>${t}</option>`).join('');
            
            if(act.type === 'StatChange') {
                const stats = ['Power', 'DefPower', 'HP', 'MP', 'SD', 'Block'].map(t => `<option ${act.stat===t?'selected':''}>${t}</option>`).join('');
                const ops = ['Gain', 'Consume'].map(t => `<option ${act.op===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <select onchange="updateAction('${eventId}', ${idx}, 'target', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${targets}</select>
                    <span class="text-slate-500 font-bold">.</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'op', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded font-bold text-teal-700">${ops}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">("</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'stat', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${stats}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">", </span>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'val', this.value)" value="${act.val}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-12 font-mono" placeholder="값">
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">);</span>
                `;
            } else if(act.type === 'IfCondition') {
                const stats = ['Power', 'HP', 'SD', 'Block', 'ActivatedTurn'].map(t => `<option ${act.stat===t?'selected':''}>${t}</option>`).join('');
                const ops = ['>', '>=', '==', '<=', '<', '!='].map(t => `<option ${act.op===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <span class="text-amber-700 font-mono text-[10px] md:text-xs font-bold">if (</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'target', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${targets}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">.CValue("</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'stat', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${stats}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">") </span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'op', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded font-bold">${ops}</select>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'val', this.value)" value="${act.val}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-10 font-mono">
                    <span class="text-amber-700 font-mono text-[10px] md:text-xs font-bold">) {</span>
                `;
            } else if(act.type === 'EndIf') {
                inner = `<span class="text-amber-700 font-mono text-[10px] md:text-xs font-bold">}</span>`;
            } else if(act.type === 'AddBuff') {
                const casterOpts = ['caster', 'owner'].map(t => `<option ${act.caster===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <select onchange="updateAction('${eventId}', ${idx}, 'target', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${targets}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">.AddBuff(new </span>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'buffClass', this.value)" value="${act.buffClass}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-16 text-blue-600 font-bold" placeholder="Class">
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">(${act.target}, </span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'caster', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${casterOpts}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">,</span>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'stack', this.value)" value="${act.stack}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-10 font-mono">
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">));</span>
                `;
            } else if(act.type === 'DCModify') {
                const fields = ['PlusDamage', 'PercentDamage', 'Damage'].map(t => `<option ${act.field===t?'selected':''}>${t}</option>`).join('');
                const ops = ['+=', '-=', '*=', '='].map(t => `<option ${act.op===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <span class="font-mono text-[10px] md:text-xs font-bold text-purple-700">DC.</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'field', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded">${fields}</select>
                    <select onchange="updateAction('${eventId}', ${idx}, 'op', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded font-bold">${ops}</select>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'val', this.value)" value="${act.val}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-12 font-mono">
                    <span class="text-slate-500 font-bold">;</span>
                `;
            } else if(act.type === 'RemoveThis') {
                inner = `<span class="font-mono text-[10px] md:text-xs text-red-600 font-semibold">owner.RemoveBuff(this);</span>`;
            } else if(act.type === 'Custom') {
                inner = `<textarea oninput="updateAction('${eventId}', ${idx}, 'code', this.value)" class="w-full border border-slate-300 rounded p-1.5 font-mono text-[11px] md:text-xs bg-slate-800 text-emerald-400 outline-none" rows="2">${act.code}</textarea>`;
            }

            let badgeColor = 'bg-slate-500';
            if(act.type==='AddBuff') badgeColor = 'bg-blue-500';
            else if(act.type==='StatChange') badgeColor = 'bg-teal-600';
            else if(act.type==='IfCondition' || act.type==='EndIf') badgeColor = 'bg-amber-500';
            else if(act.type==='DCModify') badgeColor = 'bg-purple-500';

            return `
            <div class="flex flex-col md:flex-row items-start md:items-center gap-1.5 md:gap-2 bg-white p-2 rounded border border-slate-200 relative group pr-8">
                <span class="${badgeColor} text-white text-[9px] md:text-[10px] px-1.5 py-0.5 rounded font-bold shrink-0">${act.type}</span>
                <div class="flex-1 flex flex-wrap items-center gap-1 w-full">
                    ${inner}
                </div>
                <button onclick="removeAction('${eventId}', ${idx})" class="absolute right-2 top-2 text-slate-300 hover:text-red-500">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            `;
        }

        // --- 4. 코드 생성 ---
        function generateBuffClassString(buff) {
            let descStr = (buff.description || "").replace(/\n/g, '\\n');
            let className = buff.className || "UnknownBuff";
            
            let code = `public class ${className} : Buff\n{\n`;
            code += `    public override BuffType BuffType => BuffType.${buff.buffType};\n`;
            
            // Bname은 ClassName과 동일하게
            code += `    public override string Bname => "${className}";\n`;
            if (buff.bNameKR) {
                code += `    public override string BnameKR => "${buff.bNameKR}";\n`;
            }
            code += `    public override string Description => $"${descStr}";\n\n`;

            if (buff.activatedTurn && buff.activatedTurn > 0) {
                code += `    public int ActivatedTurn;\n\n`;
            }

            code += `    public ${className}(F_Cha target, F_Cha user, int s) : base(target, user, s) \n    {\n`;
            if (buff.activatedTurn && buff.activatedTurn > 0) {
                code += `        ActivatedTurn = ${buff.activatedTurn};\n`;
            }
            code += `    }\n\n`;

            EVENT_DEF.forEach(ev => {
                const evData = buff.events[ev.id];
                if(evData && evData.active) {
                    code += `    ${EVENT_SIGNATURES[ev.id]}\n`;
                    let indentLvl = 2; // 기본 2탭(8공백)

                    evData.actions.forEach(act => {
                        let line = "";
                        if(act.type === 'EndIf') { indentLvl = Math.max(2, indentLvl - 1); }
                        
                        let indentStr = "    ".repeat(indentLvl);

                        if(act.type === 'StatChange') line = `${act.target}.${act.op}("${act.stat}", ${act.val});`;
                        else if(act.type === 'AddBuff') line = `${act.target}.AddBuff(new ${act.buffClass}(${act.target}, ${act.caster}, ${act.stack}));`;
                        else if(act.type === 'IfCondition') { line = `if (${act.target}.CValue("${act.stat}") ${act.op} ${act.val})\n${indentStr}{`; }
                        else if(act.type === 'EndIf') { line = `}`; }
                        else if(act.type === 'RemoveThis') line = `owner.RemoveBuff(this);`;
                        else if(act.type === 'DCModify') line = `DC.${act.field} ${act.op} ${act.val};`;
                        else if(act.type === 'Custom') line = act.code;
                        
                        line.split('\n').forEach((l, idx) => { 
                            if(act.type === 'IfCondition' && idx === 1) {
                                code += `${l}\n`; // 괄호 줄 들여쓰기
                            } else {
                                code += `${indentStr}${l}\n`; 
                            }
                        });

                        if(act.type === 'IfCondition') { indentLvl += 1; }
                    });

                    if(RETURN_STATEMENTS[ev.id]) {
                        code += "    ".repeat(2) + RETURN_STATEMENTS[ev.id].trim() + "\n";
                    }
                    code += `    }\n\n`;
                }
            });
            code += `}`;
            return code;
        }

        function generateFullFileString() {
            let fullCode = `using System;\nusing UnityEngine;\nusing System.Collections.Generic;\nusing System.Linq;\n\n`;
            fullCode += `/// <summary>\n/// BuffEx\n/// 이 파일은 웹 메이커에서 자동 생성되었습니다.\n/// </summary>\n\n`;
            buffCollection.forEach(buff => { fullCode += generateBuffClassString(buff) + "\n\n"; });
            return fullCode;
        }

        function renderCode() {
            if (viewMode === 'single') {
                document.getElementById('btn-view-single').className = 'text-xs px-2 py-1 rounded bg-slate-600 text-white font-bold';
                document.getElementById('btn-view-full').className = 'text-xs px-2 py-1 rounded bg-transparent text-slate-400 hover:text-white';
                document.getElementById('preview-code').textContent = buffCollection.length > 0 ? generateBuffClassString(buffCollection[currentIndex]) : "// 버프가 없습니다.";
            } else {
                document.getElementById('btn-view-single').className = 'text-xs px-2 py-1 rounded bg-transparent text-slate-400 hover:text-white';
                document.getElementById('btn-view-full').className = 'text-xs px-2 py-1 rounded bg-slate-600 text-white font-bold';
                document.getElementById('preview-code').textContent = generateFullFileString();
            }
        }

        // --- 5. 사용자 이벤트 라우팅 ---
        document.addEventListener('input', e => {
            if(e.target.matches('[data-bind]')) {
                buffCollection[currentIndex][e.target.getAttribute('data-bind')] = e.target.type === 'number' ? parseInt(e.target.value) || 0 : e.target.value;
                saveData();
                renderBuffList();
                renderCode();
            }
        });
        document.addEventListener('change', e => {
            if(e.target.matches('select[data-bind]')) {
                buffCollection[currentIndex][e.target.getAttribute('data-bind')] = e.target.value;
                saveData();
                renderCode();
            }
        });

        window.addNewBuff = function() {
            const num = buffCollection.length + 1;
            buffCollection.push(createEmptyBuff(`NewBuff${num}`, `새 버프 ${num}`));
            currentIndex = buffCollection.length - 1;
            saveData();
            renderAll();
        }

        window.selectBuff = function(idx) {
            currentIndex = idx;
            renderAll();
        }

        window.deleteCurrentBuff = function() {
            if(buffCollection.length === 1) { alert('최소 1개의 버프는 있어야 합니다.'); return; }
            if(!confirm('현재 편집 중인 버프를 삭제하시겠습니까?')) return;
            buffCollection.splice(currentIndex, 1);
            currentIndex = Math.max(0, currentIndex - 1);
            saveData();
            renderAll();
        }

        window.toggleEvent = function(id) {
            buffCollection[currentIndex].events[id].active = !buffCollection[currentIndex].events[id].active;
            saveData(); renderEditor(); renderCode(); lucide.createIcons();
        }

        window.addAction = function(id, type) {
            let act = { type };
            if(type === 'StatChange') act = { ...act, target: 'owner', op: 'Gain', stat: 'Power', val: 'stack' };
            else if (type === 'IfCondition') act = { ...act, target: 'owner', stat: 'SD', op: '>', val: '0' };
            else if (type === 'AddBuff') act = { ...act, target: 'owner', buffClass: 'Power_1T', caster: 'caster', stack: '1' };
            else if (type === 'DCModify') act = { ...act, field: 'PlusDamage', op: '+=', val: '1' };
            else if (type === 'Custom') act = { ...act, code: "// 직접 입력" };
            
            buffCollection[currentIndex].events[id].actions.push(act);
            saveData(); renderEditor(); renderCode(); lucide.createIcons();
        }

        window.removeAction = function(id, idx) {
            buffCollection[currentIndex].events[id].actions.splice(idx, 1);
            saveData(); renderEditor(); renderCode(); lucide.createIcons();
        }

        window.updateAction = function(eventId, idx, prop, val) {
            buffCollection[currentIndex].events[eventId].actions[idx][prop] = val;
            saveData(); renderCode();
        }

        window.setViewMode = function(mode) {
            viewMode = mode; renderCode();
        }

        window.resetData = function() {
            if(!confirm('모든 데이터가 삭제됩니다. 계속하시겠습니까?')) return;
            localStorage.removeItem('buffMakerData_v2');
            buffCollection = []; initApp();
        }

        window.toggleMobileCode = function() {
            const panel = document.getElementById('code-viewer-panel');
            if(panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        }

        window.copyAndOpenGitHub = function() {
            const code = generateFullFileString();
            navigator.clipboard.writeText(code).then(() => {
                alert('✨ [1단계 완료] 전체 코드가 클립보드에 복사되었습니다!\n\n이제 자동으로 GitHub 수정 페이지가 열립니다.\n화면의 기존 코드를 [전체 선택(Ctrl+A)] 한 뒤, [붙여넣기(Ctrl+V)] 하시고 Commit을 누르시면 됩니다.');
                // GitHub 편집 페이지 URL (주의: 로그인되어 있어야 정상 작동합니다)
                window.open('https://github.com/namwoo321-a11y/cardGame/edit/main/BuffEx.cs', '_blank');
            }).catch(err => {
                alert('클립보드 복사에 실패했습니다. 수동으로 복사해주세요.');
                window.open('https://github.com/namwoo321-a11y/cardGame/edit/main/BuffEx.cs', '_blank');
            });
        }

        initApp();
    </script>
</body>
</html>
