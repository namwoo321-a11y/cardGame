<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Buff Code Maker (Multi)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .code-panel::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans text-sm md:text-base">

    <!-- 상단 헤더 -->
    <header class="bg-blue-800 text-white p-3 shadow-md flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-2">
            <i data-lucide="swords" class="w-5 h-5 md:w-6 md:h-6"></i>
            <h1 class="text-lg md:text-xl font-bold tracking-wide">Buff Code Maker</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="resetData()" class="flex items-center gap-1 bg-slate-700 hover:bg-slate-600 text-white px-2 py-1.5 md:px-3 md:py-1.5 rounded text-xs md:text-sm transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i> <span class="hidden md:inline">전체 초기화</span>
            </button>
            <button onclick="copyFullCode()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1.5 md:px-3 md:py-1.5 rounded text-xs md:text-sm font-bold transition shadow">
                <i data-lucide="copy" class="w-4 h-4"></i> <span>전체 코드 복사</span>
            </button>
        </div>
    </header>

    <!-- 메인 컨테이너 (모바일: 세로 배치, 데스크탑: 가로 3단 배치) -->
    <main class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <!-- 좌측 패널: 버프 리스트 관리 -->
        <div class="w-full md:w-64 bg-slate-200 border-b md:border-b-0 md:border-r border-slate-300 flex flex-col shrink-0">
            <div class="p-3 bg-slate-300 font-bold text-slate-700 flex justify-between items-center">
                <span>버프 목록</span>
                <button onclick="addNewBuff()" class="bg-blue-600 text-white p-1 rounded hover:bg-blue-500 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>
            <!-- 리스트 영역 -->
            <div id="buff-list" class="flex md:flex-col overflow-x-auto md:overflow-y-auto p-2 gap-2 flex-1">
                <!-- JS 렌더링 -->
            </div>
        </div>

        <!-- 중앙 패널: 단일 버프 편집기 -->
        <div id="editor-panel" class="flex-1 h-full overflow-y-auto p-3 md:p-6 space-y-4 md:space-y-6">
            
            <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-base md:text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i data-lucide="info" class="w-4 h-4 text-blue-600"></i> 기본 정보
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Class Name (영문)</label>
                        <input type="text" id="inp-className" data-bind="className" class="w-full border border-slate-300 rounded p-1.5 md:p-2 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">BuffType</label>
                        <select id="inp-buffType" data-bind="buffType" class="w-full border border-slate-300 rounded p-1.5 md:p-2 focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <option value="Good">Good (긍정)</option>
                            <option value="Bad">Bad (부정)</option>
                            <option value="Power">Power (지속)</option>
                            <option value="Resource">Resource (자원)</option>
                            <option value="Important">Important (주요)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Bname (인게임 출력 버프명)</label>
                        <input type="text" id="inp-bName" data-bind="bName" class="w-full border border-slate-300 rounded p-1.5 md:p-2 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Description (설명 툴팁)</label>
                        <textarea id="inp-description" data-bind="description" class="w-full border border-slate-300 rounded p-1.5 md:p-2 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono text-xs md:text-sm" rows="2" placeholder="예: 힘 +{stack}\n턴 종료시 제거"></textarea>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-base md:text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> 발동 로직 설정
                </h2>
                <div id="event-list-container" class="space-y-2 md:space-y-3 pb-10">
                    <!-- JS 렌더링 -->
                </div>
            </section>
        </div>

        <!-- 우측 패널: 결과 코드 뷰어 (모바일에서는 탭/아코디언 느낌으로 처리하거나 하단에 배치) -->
        <div class="w-full h-64 md:h-full md:w-[400px] lg:w-[500px] bg-slate-900 flex flex-col border-t md:border-t-0 md:border-l border-slate-700 shrink-0">
            <div class="flex justify-between items-center bg-slate-800 px-3 py-2 shrink-0 border-b border-slate-700">
                <div class="flex gap-2">
                    <button onclick="setViewMode('single')" id="btn-view-single" class="text-xs px-2 py-1 rounded bg-slate-600 text-white font-bold">현재 버프</button>
                    <button onclick="setViewMode('full')" id="btn-view-full" class="text-xs px-2 py-1 rounded bg-transparent text-slate-400 hover:text-white">전체(BuffEx)</button>
                </div>
            </div>
            <div class="p-3 overflow-y-auto flex-1 code-panel">
                <pre><code id="preview-code" class="text-emerald-400 font-mono text-[11px] md:text-[13px] leading-relaxed break-all whitespace-pre-wrap"></code></pre>
            </div>
        </div>
    </main>

    <script>
        // --- 1. 상수 및 데이터 구조 ---
        const EVENT_DEF = [
            { id: 'OnActivate', name: 'OnActivate()', desc: '최초 부여 시' },
            { id: 'OnUpdate', name: 'OnUpdate(int val)', desc: '스택 갱신 시' },
            { id: 'OnDeactivate', name: 'OnDeactivate()', desc: '완전히 제거될 때' },
            { id: 'OnTurnStart', name: 'OnTurnStart()', desc: '턴 시작 시' },
            { id: 'OnTurnEnd', name: 'OnTurnEnd()', desc: '턴 종료 시' },
            { id: 'BeforeDamaged', name: 'BeforeDamaged(DamContext DC)', desc: '피격 전 (피해량 조작)' },
            { id: 'AfterDamaged', name: 'AfterDamaged(DamContext DC)', desc: '피격 후 (스택 조작 등)' },
            { id: 'BeforeAttack', name: 'BeforeAttack(DamContext DC)', desc: '공격 전 (피해량 증가)' },
            { id: 'AfterAttack', name: 'AfterAttack(DamContext DC)', desc: '공격 후 (흡혈 등)' }
        ];

        const EVENT_SIGNATURES = {
            OnActivate: "public override void OnActivate()\n    {",
            OnDeactivate: "public override void OnDeactivate()\n    {",
            OnUpdate: "public override void OnUpdate(int val)\n    {",
            OnTurnStart: "public override void OnTurnStart()\n    {",
            OnTurnEnd: "public override void OnTurnEnd()\n    {",
            BeforeDamaged: "public override DamContext BeforeDamaged(DamContext DC)\n    {",
            AfterDamaged: "public override void AfterDamaged(DamContext DC)\n    {",
            BeforeAttack: "public override DamContext BeforeAttack(DamContext DC)\n    {",
            AfterAttack: "public override void AfterAttack(DamContext DC)\n    {"
        };

        const RETURN_STATEMENTS = {
            BeforeDamaged: "        return DC;\n",
            BeforeAttack: "        return DC;\n"
        };

        // 전체 데이터 (로컬 스토리지 연동)
        let buffCollection = [];
        let currentIndex = 0;
        let viewMode = 'single'; // 'single' or 'full'

        // --- 2. 초기화 및 저장소 관리 ---
        function initApp() {
            const saved = localStorage.getItem('buffMakerData');
            if (saved) {
                try {
                    buffCollection = JSON.parse(saved);
                } catch (e) {
                    console.error("Data parse error", e);
                    buffCollection = [];
                }
            }

            if (buffCollection.length === 0) {
                buffCollection.push(createEmptyBuff("NewBuff1", "새 버프 1"));
            }

            currentIndex = 0;
            renderAll();
        }

        function saveData() {
            localStorage.setItem('buffMakerData', JSON.stringify(buffCollection));
        }

        function createEmptyBuff(cName, kName) {
            let b = {
                id: Date.now() + Math.floor(Math.random() * 1000),
                className: cName,
                bName: kName,
                description: "",
                buffType: "Good",
                events: {}
            };
            EVENT_DEF.forEach(ev => b.events[ev.id] = { active: false, actions: [] });
            return b;
        }

        // --- 3. UI 렌더링 ---
        function renderAll() {
            renderBuffList();
            renderEditor();
            renderCode();
            lucide.createIcons();
        }

        function renderBuffList() {
            const listEl = document.getElementById('buff-list');
            let html = '';
            buffCollection.forEach((buff, idx) => {
                const isSelected = idx === currentIndex;
                html += `
                    <div class="flex items-center justify-between p-2 rounded cursor-pointer shrink-0 w-40 md:w-auto transition ${isSelected ? 'bg-blue-100 border-blue-400 border shadow-sm' : 'bg-white border-slate-200 border hover:bg-slate-50'}" onclick="selectBuff(${idx})">
                        <div class="overflow-hidden">
                            <div class="font-bold text-slate-800 text-xs truncate">${buff.className}</div>
                            <div class="text-[10px] text-slate-500 truncate">${buff.bName}</div>
                        </div>
                        <button onclick="event.stopPropagation(); deleteBuff(${idx})" class="text-slate-400 hover:text-red-500 p-1">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function renderEditor() {
            if (buffCollection.length === 0) {
                document.getElementById('editor-panel').style.display = 'none';
                return;
            }
            document.getElementById('editor-panel').style.display = 'block';

            const buff = buffCollection[currentIndex];
            
            // 기본 정보 세팅
            document.getElementById('inp-className').value = buff.className;
            document.getElementById('inp-buffType').value = buff.buffType;
            document.getElementById('inp-bName').value = buff.bName;
            document.getElementById('inp-description').value = buff.description;

            // 이벤트 리스트 렌더링
            let html = '';
            EVENT_DEF.forEach(ev => {
                const evData = buff.events[ev.id];
                const isActive = evData.active;
                
                html += `
                <div class="bg-white rounded-lg shadow-sm border transition-all duration-200 ${isActive ? 'border-blue-500 ring-1 ring-blue-500' : 'border-slate-200'}">
                    <div class="flex items-center justify-between p-2.5 md:p-3 cursor-pointer hover:bg-slate-50 rounded-lg" onclick="toggleEvent('${ev.id}')">
                        <div class="flex items-center gap-2 md:gap-3">
                            <input type="checkbox" ${isActive ? 'checked' : ''} onclick="event.stopPropagation(); toggleEvent('${ev.id}')" class="w-4 h-4 text-blue-600 rounded">
                            <span class="font-bold font-mono text-slate-800 text-xs md:text-sm">${ev.name}</span>
                        </div>
                        <span class="text-[10px] md:text-xs text-slate-400 hidden md:block">${ev.desc}</span>
                    </div>
                `;

                if (isActive) {
                    html += `<div class="p-2 md:p-4 pt-0 border-t border-slate-100 bg-slate-50/50 rounded-b-lg">`;
                    html += `<div class="space-y-2 mt-2">`;
                    evData.actions.forEach((act, idx) => {
                        html += renderAction(ev.id, idx, act);
                    });
                    html += `</div>`;
                    
                    // 액션 툴바
                    html += `
                        <div class="mt-3 flex flex-wrap gap-1.5 md:gap-2">
                            <button onclick="addAction('${ev.id}', 'StatChange')" class="flex items-center gap-1 text-[10px] md:text-xs bg-white border border-slate-300 hover:border-slate-400 px-2 py-1 md:py-1.5 rounded shadow-sm"><i data-lucide="plus" class="w-3 h-3"></i> 스탯 증감</button>
                            <button onclick="addAction('${ev.id}', 'AddBuff')" class="flex items-center gap-1 text-[10px] md:text-xs bg-white border border-slate-300 hover:border-slate-400 px-2 py-1 md:py-1.5 rounded shadow-sm"><i data-lucide="plus" class="w-3 h-3"></i> 버프 부여</button>
                            <button onclick="addAction('${ev.id}', 'RemoveThis')" class="flex items-center gap-1 text-[10px] md:text-xs bg-white border border-slate-300 hover:border-slate-400 px-2 py-1 md:py-1.5 rounded shadow-sm"><i data-lucide="trash-2" class="w-3 h-3 text-red-500"></i> 자신 제거</button>
                            <button onclick="addAction('${ev.id}', 'Custom')" class="flex items-center gap-1 text-[10px] md:text-xs bg-slate-800 text-white px-2 py-1 md:py-1.5 rounded shadow-sm"><i data-lucide="code" class="w-3 h-3"></i> 커스텀 코드</button>
                    `;
                    
                    if(ev.id === 'OnUpdate') html += `<button onclick="addAction('${ev.id}', 'BaseCall')" class="flex items-center gap-1 text-[10px] md:text-xs bg-indigo-50 border border-indigo-200 text-indigo-700 px-2 py-1 md:py-1.5 rounded shadow-sm"><i data-lucide="arrow-up-to-line" class="w-3 h-3"></i> base.OnUpdate</button>`;
                    if(ev.id === 'BeforeAttack' || ev.id === 'BeforeDamaged') html += `<button onclick="addAction('${ev.id}', 'DCModify')" class="flex items-center gap-1 text-[10px] md:text-xs bg-purple-50 border border-purple-200 text-purple-700 px-2 py-1 md:py-1.5 rounded shadow-sm"><i data-lucide="trending-up" class="w-3 h-3"></i> DC 수정</button>`;
                    
                    html += `</div></div>`;
                }
                html += `</div>`;
            });

            document.getElementById('event-list-container').innerHTML = html;
        }

        function renderAction(eventId, idx, act) {
            let inner = '';
            const targetOptions = ['owner', 'caster', 'DC.Target', 'DC.Attacker'].map(t => `<option ${act.target===t?'selected':''}>${t}</option>`).join('');
            
            if(act.type === 'StatChange') {
                const stats = ['Power', 'DefPower', 'HP', 'MP', 'SD', 'Block'].map(t => `<option ${act.stat===t?'selected':''}>${t}</option>`).join('');
                const ops = ['+=', '-=', '='].map(t => `<option ${act.op===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <select onchange="updateAction('${eventId}', ${idx}, 'target', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white">${targetOptions}</select>
                    <span class="text-slate-500 font-bold">.</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'stat', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white">${stats}</select>
                    <select onchange="updateAction('${eventId}', ${idx}, 'op', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white font-mono">${ops}</select>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'val', this.value)" value="${act.val}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-12 md:w-16 outline-none font-mono" placeholder="값">
                    <span class="text-slate-500 font-bold">;</span>
                `;
            } else if(act.type === 'AddBuff') {
                const casterOpts = ['caster', 'owner'].map(t => `<option ${act.caster===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <select onchange="updateAction('${eventId}', ${idx}, 'target', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white">${targetOptions}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">.AddBuff(new </span>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'buffClass', this.value)" value="${act.buffClass}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-16 md:w-24 text-blue-600 font-bold" placeholder="Class">
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">(대상, </span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'caster', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white">${casterOpts}</select>
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">,</span>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'stack', this.value)" value="${act.stack}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-10 md:w-14 font-mono" placeholder="스택">
                    <span class="text-slate-700 font-mono text-[10px] md:text-xs">));</span>
                `;
            } else if(act.type === 'RemoveThis') {
                inner = `<span class="font-mono text-[10px] md:text-xs text-red-600 font-semibold">owner.RemoveBuff(this);</span>`;
            } else if(act.type === 'BaseCall') {
                inner = `<span class="font-mono text-[10px] md:text-xs text-indigo-600 font-semibold">base.OnUpdate(val);</span>`;
            } else if(act.type === 'DCModify') {
                const fields = ['PlusDamage', 'PercentDamage', 'Damage'].map(t => `<option ${act.field===t?'selected':''}>${t}</option>`).join('');
                const ops = ['+=', '-=', '*=', '='].map(t => `<option ${act.op===t?'selected':''}>${t}</option>`).join('');
                inner = `
                    <span class="font-mono text-[10px] md:text-xs font-bold text-purple-700">DC.</span>
                    <select onchange="updateAction('${eventId}', ${idx}, 'field', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white">${fields}</select>
                    <select onchange="updateAction('${eventId}', ${idx}, 'op', this.value)" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded bg-white font-mono text-purple-700">${ops}</select>
                    <input type="text" oninput="updateAction('${eventId}', ${idx}, 'val', this.value)" value="${act.val}" class="border border-slate-300 p-1 text-[10px] md:text-xs rounded w-12 md:w-16 font-mono" placeholder="값">
                    <span class="text-slate-500 font-bold">;</span>
                `;
            } else if(act.type === 'Custom') {
                inner = `
                    <textarea oninput="updateAction('${eventId}', ${idx}, 'code', this.value)" class="w-full border border-slate-300 rounded p-2 mt-1 font-mono text-[11px] md:text-xs bg-slate-800 text-emerald-400 outline-none leading-tight" rows="3" placeholder="C# 코드 입력">${act.code}</textarea>
                `;
            }

            let badgeColor = 'bg-slate-500';
            if(act.type==='AddBuff') badgeColor = 'bg-blue-500';
            else if(act.type==='StatChange') badgeColor = 'bg-teal-500';
            else if(act.type==='Custom') badgeColor = 'bg-slate-800';
            else if(act.type==='DCModify') badgeColor = 'bg-purple-500';

            return `
            <div class="flex flex-col md:flex-row items-start md:items-center gap-1 md:gap-3 bg-white p-2 md:p-3 rounded-lg border border-slate-200 relative group pr-8">
                <span class="${badgeColor} text-white text-[9px] md:text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded font-bold shrink-0 md:mt-1">${act.type}</span>
                <div class="flex-1 flex flex-wrap items-center gap-1 w-full">
                    ${inner}
                </div>
                <button onclick="removeAction('${eventId}', ${idx})" class="absolute top-2 right-2 md:top-1/2 md:-translate-y-1/2 md:right-3 text-slate-300 hover:text-red-500 transition">
                    <i data-lucide="x" class="w-4 h-4 md:w-5 md:h-5"></i>
                </button>
            </div>
            `;
        }

        function renderCode() {
            if (viewMode === 'single') {
                document.getElementById('btn-view-single').className = 'text-xs px-2 py-1 rounded bg-slate-600 text-white font-bold';
                document.getElementById('btn-view-full').className = 'text-xs px-2 py-1 rounded bg-transparent text-slate-400 hover:text-white';
                
                if(buffCollection.length === 0) {
                    document.getElementById('preview-code').textContent = "// 버프가 없습니다.";
                    return;
                }
                document.getElementById('preview-code').textContent = generateBuffClassString(buffCollection[currentIndex]);
            } else {
                document.getElementById('btn-view-single').className = 'text-xs px-2 py-1 rounded bg-transparent text-slate-400 hover:text-white';
                document.getElementById('btn-view-full').className = 'text-xs px-2 py-1 rounded bg-slate-600 text-white font-bold';
                
                document.getElementById('preview-code').textContent = generateFullFileString();
            }
        }

        function generateBuffClassString(buff) {
            let descStr = buff.description.replace(/\n/g, '\\n');
            let code = `public class ${buff.className} : Buff\n{\n`;
            code += `    public override BuffType BuffType => BuffType.${buff.buffType};\n`;
            code += `    public override string Bname => "${buff.bName}";\n`;
            code += `    public override string Description => $"${descStr}";\n\n`;
            code += `    public ${buff.className}(F_Cha target, F_Cha user, int s) : base(target, user, s) { }\n\n`;

            EVENT_DEF.forEach(ev => {
                const evData = buff.events[ev.id];
                if(evData && evData.active) {
                    code += `    ${EVENT_SIGNATURES[ev.id]}\n`;
                    evData.actions.forEach(act => {
                        let line = "";
                        if(act.type === 'StatChange') line = `${act.target}.${act.stat} ${act.op} ${act.val};`;
                        else if(act.type === 'AddBuff') line = `${act.target}.AddBuff(new ${act.buffClass}(${act.target}, ${act.caster}, ${act.stack}));`;
                        else if(act.type === 'RemoveThis') line = `owner.RemoveBuff(this);`;
                        else if(act.type === 'BaseCall') line = `base.${ev.id}(${ev.id === 'OnUpdate' ? 'val' : ''});`;
                        else if(act.type === 'DCModify') line = `DC.${act.field} ${act.op} ${act.val};`;
                        else if(act.type === 'Custom') line = act.code;
                        
                        line.split('\n').forEach(l => { code += `        ${l}\n`; });
                    });
                    if(RETURN_STATEMENTS[ev.id]) code += RETURN_STATEMENTS[ev.id];
                    code += `    }\n\n`;
                }
            });
            code += `}`;
            return code;
        }

        function generateFullFileString() {
            let fullCode = `using System;\nusing UnityEngine;\nusing System.Collections.Generic;\nusing System.Linq;\n\n`;
            fullCode += `/// <summary>\n/// BuffEx\n///\n/// 이 파일은 웹 메이커에서 자동 생성되었습니다.\n/// </summary>\n\n`;
            
            buffCollection.forEach(buff => {
                fullCode += generateBuffClassString(buff) + "\n\n";
            });
            return fullCode;
        }

        // --- 4. 사용자 액션 (이벤트 라우팅) ---

        // 입력 폼 바인딩
        document.addEventListener('input', e => {
            if(e.target.matches('[data-bind]')) {
                buffCollection[currentIndex][e.target.getAttribute('data-bind')] = e.target.value;
                saveData();
                renderBuffList(); // 리스트에 이름 즉시 반영
                renderCode();
            }
        });
        document.addEventListener('change', e => {
            if(e.target.matches('select[data-bind]')) {
                buffCollection[currentIndex][e.target.getAttribute('data-bind')] = e.target.value;
                saveData();
                renderCode();
            }
        });

        window.addNewBuff = function() {
            const num = buffCollection.length + 1;
            buffCollection.push(createEmptyBuff(`NewBuff${num}`, `새 버프 ${num}`));
            currentIndex = buffCollection.length - 1;
            saveData();
            renderAll();
        }

        window.selectBuff = function(idx) {
            currentIndex = idx;
            renderAll();
        }

        window.deleteBuff = function(idx) {
            if(buffCollection.length === 1) {
                alert('최소 1개의 버프는 있어야 합니다.');
                return;
            }
            if(!confirm('이 버프를 삭제하시겠습니까?')) return;
            
            buffCollection.splice(idx, 1);
            if(currentIndex >= buffCollection.length) currentIndex = buffCollection.length - 1;
            saveData();
            renderAll();
        }

        window.toggleEvent = function(id) {
            buffCollection[currentIndex].events[id].active = !buffCollection[currentIndex].events[id].active;
            saveData();
            renderEditor();
            renderCode();
            lucide.createIcons();
        }

        window.addAction = function(id, type) {
            let act = { type };
            if(type === 'StatChange') act = { ...act, target: 'owner', stat: 'Power', op: '+=', val: 'stack' };
            else if (type === 'AddBuff') act = { ...act, target: 'owner', buffClass: 'Power', caster: 'caster', stack: 'stack' };
            else if (type === 'DCModify') act = { ...act, field: 'PlusDamage', op: '+=', val: '1' };
            else if (type === 'Custom') act = { ...act, code: "// 커스텀 코드" };
            
            buffCollection[currentIndex].events[id].actions.push(act);
            saveData();
            renderEditor();
            renderCode();
            lucide.createIcons();
        }

        window.removeAction = function(id, idx) {
            buffCollection[currentIndex].events[id].actions.splice(idx, 1);
            saveData();
            renderEditor();
            renderCode();
            lucide.createIcons();
        }

        window.updateAction = function(eventId, idx, prop, val) {
            buffCollection[currentIndex].events[eventId].actions[idx][prop] = val;
            saveData();
            renderCode();
        }

        window.setViewMode = function(mode) {
            viewMode = mode;
            renderCode();
        }

        window.resetData = function() {
            if(!confirm('저장된 모든 버프 데이터가 삭제됩니다. 계속하시겠습니까?')) return;
            localStorage.removeItem('buffMakerData');
            buffCollection = [];
            initApp();
        }

        window.copyFullCode = function() {
            const code = generateFullFileString();
            navigator.clipboard.writeText(code).then(() => {
                alert('전체 코드가 복사되었습니다!\n스마트폰의 깃허브(GitHub) 웹페이지에 접속해서 붙여넣기 하세요.');
            }).catch(err => {
                alert('복사에 실패했습니다. 코드 영역을 직접 길게 눌러 복사해주세요.');
            });
        }

        // 초기 시작
        initApp();

    </script>
</body>
</html>
